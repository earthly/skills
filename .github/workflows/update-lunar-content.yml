name: Update Lunar Content

on:
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.LUNAR_CONTENT_UPDATER_DEPLOY_KEY }}

      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Earthly git credentials for private lunar repo
        run: |
          mkdir -p ~/.earthly
          cat > ~/.earthly/config.yml << EOF
          git:
            github.com:
              auth: https
              user: x-access-token
              password: ${LUNAR_REPO_PAT}
          EOF
        env:
          LUNAR_REPO_PAT: ${{ secrets.LUNAR_REPO_PAT }}

      - name: Refresh lunar-lib references
        run: earthly +update-lunar-references

      # Separate step: this target fails when the docs page moves or its
      # extension-point table changes, and that must not block the step above.
      - name: Refresh lunar-uipanel references
        continue-on-error: true
        run: earthly +update-uipanel-references

      - name: Check for changes
        id: changes
        run: |
          # --porcelain also lists untracked files, which a first refresh of a
          # new skill's references/ produces.
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update Lunar references"
          git push
