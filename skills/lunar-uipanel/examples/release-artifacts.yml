# uiPanels.release-artifacts: the Artifacts tab of the Release Ledger.
#
# One row per image built in CI for the release commit, read from the docker
# collector's `containers.builds` array. Copy it into the configuration
# repository and point `uiPanels.release-artifacts` at it, then change the
# columns to match what your build collectors record. Panel file format:
# https://docs-lunar.earthly.dev/configuration/lunar-config/uipanels.md
#
# `expected_git_sha` is the SHA the build step intended to stamp on the image;
# when it differs from the release commit the provenance chain is broken, which
# the "Matches release?" column calls out. The :sha parameter is the dashboard's
# release commit; a prefix of at least six characters resolves too.
tabs:
  - name: Container images
    type: table
    sql: |
      WITH resolved AS (
        SELECT c.git_sha::text AS git_sha, c.component_json AS j
        FROM public.components c
        WHERE c.pr IS NULL
          AND c.component_id = :component
          AND (c.git_sha::text = :sha
               OR (length(:sha) >= 6 AND c.git_sha::text LIKE :sha || '%'))
        ORDER BY c.timestamp DESC
        LIMIT 1
      )
      SELECT
        coalesce(b->>'image', '—') AS image,
        coalesce(b->>'tag', '—') AS tag,
        left(coalesce(b->>'expected_git_sha', '—'), 7) AS image_sha,
        CASE
          WHEN b->>'expected_git_sha' = r.git_sha THEN '✅ yes'
          WHEN b->>'expected_git_sha' IS NULL THEN '—'
          ELSE '❌ no'
        END AS matches,
        coalesce(b->>'platform', '—') AS platform,
        coalesce(b->>'dockerfile', 'Dockerfile') AS dockerfile
      FROM resolved r
      CROSS JOIN LATERAL jsonb_array_elements(coalesce(r.j->'containers'->'builds', '[]'::jsonb)) AS b
      ORDER BY b->>'image', b->>'tag'
    columns:
      - sqlId: image
        name: Image
      - sqlId: tag
        name: Tag
        width: 360
      - sqlId: image_sha
        name: Git SHA on image
        width: 140
      - sqlId: matches
        name: Matches release?
        width: 160
        alignment: center
      - sqlId: platform
        name: Platform
        width: 260
      - sqlId: dockerfile
        name: Dockerfile
        width: 260
